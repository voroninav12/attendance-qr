<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Посещаемость{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f2f2f2;
            margin: 0;
            color: #222;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        h1 { font-size: 22px; margin: 0 0 12px; }
        h2 { font-size: 17px; margin: 0 0 10px; }
        a { color: #0645ad; }
        button, .btn {
            display: inline-block;
            padding: 8px 14px;
            font-size: 14px;
            border: 1px solid #999;
            border-radius: 6px;
            background: #fff;
            color: #222;
            cursor: pointer;
            text-decoration: none;
        }
        button:hover, .btn:hover { background: #eee; }
        .btn-primary {
            background: #2c6bed;
            border-color: #2c6bed;
            color: #fff;
        }
        .btn-primary:hover { background: #1f55c9; }
        .btn-danger { color: #b00; border-color: #b00; }
        .btn-danger:hover { background: #ffecec; }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        label { display: block; font-size: 13px; color: #555; margin: 6px 0 4px; }
        .flash {
            background: #ffecec;
            border: 1px solid #f5c2c2;
            color: #b00;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .stat { text-align: center; padding: 8px 0; }
        .stat .num { font-size: 26px; font-weight: 700; }
        .stat .lbl { color: #666; font-size: 12px; }
        ul.list { list-style: none; padding: 0; margin: 0; }
        ul.list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        ul.list li:last-child { border-bottom: none; }
        .qr { text-align: center; }
        .qr img { width: 240px; height: 240px; }
        .hint { color: #666; font-size: 13px; }
        code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
