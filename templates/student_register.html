{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto;">
    <h1>Регистрация ученика</h1>
    <p class="hint">Введите фамилию и имя (как в списке класса) и класс. Устройство запомнится.</p>
    <form method="post">
        <label>Фамилия и имя</label>
        <input type="text" name="full_name" autocomplete="off" required>
        <label>Класс</label>
        <input type="text" name="class_id" value="{{ default_class }}" autocomplete="off" required>
        <button type="submit" class="btn-primary">Зарегистрировать устройство</button>
    </form>
</div>
{% endblock %}
